<!DOCTYPE html>
<script src="../../testing.js"></script>

<script id="sheet">
  {
    // Disconnected style element should have no sheet
    testing.expectEqual(null, document.createElement('style').sheet);

    // Connected style element should have a CSSStyleSheet
    const style = document.createElement('style');
    document.head.appendChild(style);
    testing.expectEqual(true, style.sheet instanceof CSSStyleSheet);

    // Same sheet instance on repeated access
    testing.expectEqual(true, style.sheet === style.sheet);

    // Non-CSS type should have no sheet
    const lessStyle = document.createElement('style');
    lessStyle.type = 'text/less';
    document.head.appendChild(lessStyle);
    testing.expectEqual(null, lessStyle.sheet);

    // Empty type attribute is valid (defaults to text/css per spec)
    const emptyType = document.createElement('style');
    emptyType.setAttribute('type', '');
    document.head.appendChild(emptyType);
    testing.expectEqual(true, emptyType.sheet instanceof CSSStyleSheet);

    // Case-insensitive type check
    const upperType = document.createElement('style');
    upperType.type = 'TEXT/CSS';
    document.head.appendChild(upperType);
    testing.expectEqual(true, upperType.sheet instanceof CSSStyleSheet);

    // Disconnection clears sheet
    const tempStyle = document.createElement('style');
    document.head.appendChild(tempStyle);
    testing.expectEqual(true, tempStyle.sheet instanceof CSSStyleSheet);
    document.head.removeChild(tempStyle);
    testing.expectEqual(null, tempStyle.sheet);

    // ownerNode points back to the style element
    const ownStyle = document.createElement('style');
    document.head.appendChild(ownStyle);
    testing.expectEqual(true, ownStyle.sheet.ownerNode === ownStyle);
  }
</script>

<script id="type">
  {
    const style = document.createElement('style');
    testing.expectEqual('', style.type);

    style.type = 'text/plain';
    testing.expectEqual('text/plain', style.type);
  }
</script>

<script id="media">
  {
    const style = document.createElement('style');
    testing.expectEqual('', style.media);

    style.media = 'screen';
    testing.expectEqual('screen', style.media);

    style.media = 'print and (max-width: 600px)';
    testing.expectEqual('print and (max-width: 600px)', style.media);
  }
</script>

<script id="blocking">
  {
    const style = document.createElement('style');
    testing.expectEqual('', style.blocking);

    style.blocking = 'render';
    testing.expectEqual('render', style.blocking);
  }
</script>

<script id="disabled">
  {
    const style = document.createElement('style');
    testing.expectEqual(false, style.disabled);

    style.disabled = true;
    testing.expectEqual(true, style.disabled);

    style.disabled = false;
    testing.expectEqual(false, style.disabled);
  }
</script>

<script id="attributes">
  {
    const style = document.createElement('style');

    style.setAttribute('media', 'screen');
    testing.expectEqual('screen', style.media);

    style.setAttribute('type', 'text/less');
    testing.expectEqual('text/less', style.type);

    style.setAttribute('disabled', '');
    testing.expectEqual(true, style.disabled);
  }
</script>

<script id="style-load-event" type=module>
  // A style element fires a load event when appended to the DOM.
  const state = await testing.async();
  const style = document.createElement("style");

  style.addEventListener("load", (e) => {
    state.resolve(e);
  });
  document.head.appendChild(style);

  await state.done((e) => {
    testing.expectEqual(false, e.bubbles);
    testing.expectEqual(false, e.cancelBubble);
    testing.expectEqual(false, e.cancelable);
    testing.expectEqual(false, e.composed);
    testing.expectEqual(true, e.isTrusted);
    testing.expectEqual(style, e.target);
  });
</script>

<script id="style-tag-content-parsing">
{
  const style = document.createElement("style");
  style.textContent = '.content-test { padding: 5px; }';
  document.head.appendChild(style);

  const sheet = style.sheet;
  testing.expectTrue(sheet instanceof CSSStyleSheet);
  testing.expectEqual(1, sheet.cssRules.length);
  testing.expectEqual('.content-test', sheet.cssRules[0].selectorText);
  testing.expectEqual('5px', sheet.cssRules[0].style.padding);
}
</script>

<body>
<script id="children-change-replaces-lazy-sheet">
{
  for (const materialized of [false]) {
    const probe = document.createElement('div');
    probe.id = 'lifecycle-probe';
    probe.style.cssText = 'width: 10px; height: 10px';
    document.body.appendChild(probe);
    const style = document.createElement('style');
    style.textContent = '#lifecycle-probe { width: 25px !important }';
    document.head.appendChild(style);
    const oldSheet = style.sheet;
    if (materialized) testing.expectEqual(1, oldSheet.cssRules.length);
    const count = document.styleSheets.length;
    testing.expectEqual(25, probe.getBoundingClientRect().width);
    style.textContent = '#lifecycle-probe { width: 75px !important }';
    testing.expectEqual(75, probe.getBoundingClientRect().width);
    testing.expectTrue(style.sheet !== oldSheet);
    testing.expectEqual(null, oldSheet.ownerNode);
    testing.expectEqual('25px', oldSheet.cssRules[0].style.width);
    testing.expectEqual('75px', style.sheet.cssRules[0].style.width);
    testing.expectEqual(count, document.styleSheets.length);
    oldSheet.insertRule('#lifecycle-probe { width: 95px !important }', 1);
    testing.expectEqual(75, probe.getBoundingClientRect().width);
    style.textContent = '';
    testing.expectEqual(10, probe.getBoundingClientRect().width);
    testing.expectEqual(0, style.sheet.cssRules.length);
    testing.expectEqual(count, document.styleSheets.length);
    style.textContent = '#lifecycle-probe { width: 45px !important }';
    testing.expectEqual(45, probe.getBoundingClientRect().width);
    style.remove(); probe.remove();
  }
}
</script>

<script id="children-change-mutation-paths">
{
  const probe = document.createElement('div');
  probe.id = 'lifecycle-data'; probe.style.cssText = 'width: 10px; height: 10px';
  document.body.appendChild(probe);
  const style = document.createElement('style');
  style.textContent = '#lifecycle-data { width: 25px !important }';
  document.head.appendChild(style);
  testing.expectEqual(25, probe.getBoundingClientRect().width);
  style.firstChild.data = '#lifecycle-data { width: 35px !important }';
  testing.expectEqual(35, probe.getBoundingClientRect().width);
  const extra = document.createTextNode('#lifecycle-data { width: 65px !important }');
  style.appendChild(extra);
  testing.expectEqual(65, probe.getBoundingClientRect().width);
  style.removeChild(extra);
  testing.expectEqual(35, probe.getBoundingClientRect().width);
  const fragment = document.createDocumentFragment();
  fragment.appendChild(document.createTextNode('#lifecycle-data {'));
  fragment.appendChild(document.createTextNode('width: 85px !important }'));
  style.replaceChildren(fragment);
  testing.expectEqual(85, probe.getBoundingClientRect().width);
  style.innerHTML = '#lifecycle-data { width: 55px !important }';
  testing.expectEqual(55, probe.getBoundingClientRect().width);
  const old = style.sheet;
  style.remove();
  testing.expectEqual(null, old.ownerNode);
  testing.expectEqual(10, probe.getBoundingClientRect().width);
  style.firstChild.data = '#lifecycle-data { width: 95px !important }';
  testing.expectEqual(null, style.sheet);
  document.head.appendChild(style);
  testing.expectEqual(95, probe.getBoundingClientRect().width);
  style.remove(); probe.remove();
}
</script>
<script id="children-change-sheet-order">
{
  const probe = document.createElement('div'); probe.id = 'lifecycle-order';
  probe.style.cssText = 'width: 10px; height: 10px'; document.body.appendChild(probe);
  const first = document.createElement('style'), last = document.createElement('style');
  first.textContent = '#lifecycle-order { width: 25px !important }';
  last.textContent = '#lifecycle-order { width: 50px !important }';
  document.head.append(first, last);
  const count = document.styleSheets.length;
  testing.expectEqual(50, probe.getBoundingClientRect().width);
  first.textContent = '#lifecycle-order { width: 75px !important }';
  testing.expectEqual(50, probe.getBoundingClientRect().width);
  testing.expectEqual(first.sheet, document.styleSheets[count - 2]);
  testing.expectEqual(last.sheet, document.styleSheets[count - 1]);
  testing.expectEqual(count, document.styleSheets.length);
  last.remove(); testing.expectEqual(75, probe.getBoundingClientRect().width);
  first.remove(); probe.remove();
}
</script>
<script id="children-change-owner-frame" type="module">
  const state = await testing.async();
  const iframe = document.createElement('iframe');
  iframe.srcdoc = '<!doctype html><html><head><style>#owner-probe { width: 25px !important }</style></head><body><div id="owner-probe" style="width:10px;height:10px"></div></body></html>';
  iframe.onload = () => state.resolve();
  document.body.appendChild(iframe);
  await state.done(() => {
    const doc = iframe.contentDocument, style = doc.querySelector('style'), probe = doc.getElementById('owner-probe');
    const parentCount = document.styleSheets.length, old = style.sheet;
    testing.expectEqual(1, old.cssRules.length);
    testing.expectEqual(25, probe.getBoundingClientRect().width);
    style.textContent = '#owner-probe { width: 75px !important }';
    testing.expectEqual(75, probe.getBoundingClientRect().width);
    testing.expectEqual(null, old.ownerNode);
    testing.expectEqual(1, doc.styleSheets.length);
    testing.expectEqual(style.sheet, doc.styleSheets[0]);
    testing.expectEqual(parentCount, document.styleSheets.length);
    iframe.remove();
  });
</script>
<script id="children-change-normalize">
{
  const probe = document.createElement('div'); probe.id = 'lifecycle-normalize';
  probe.style.cssText = 'width: 10px; height: 10px'; document.body.appendChild(probe);
  const style = document.createElement('style');
  style.append(document.createTextNode('#lifecycle-normalize { width: 25px !important }'),
               document.createTextNode('#lifecycle-normalize { width: 75px !important }'));
  document.head.appendChild(style);
  testing.expectEqual(75, probe.getBoundingClientRect().width);
  style.normalize();
  testing.expectEqual(75, probe.getBoundingClientRect().width);
  testing.expectEqual(2, style.sheet.cssRules.length);
  testing.expectEqual('75px', style.sheet.cssRules[1].style.width);
  style.remove(); probe.remove();
}
</script>
<script id="children-change-state-preserving-move">
{
  const probe = document.createElement('div'); probe.id = 'lifecycle-move';
  probe.style.cssText = 'width: 10px; height: 10px'; document.body.appendChild(probe);
  const style = document.createElement('style'), last = document.createElement('style');
  style.textContent = '#lifecycle-move { width: 25px !important }';
  last.textContent = '#lifecycle-move { width: 50px !important }';
  document.head.append(style, last);
  const sheet = style.sheet, count = document.styleSheets.length;
  sheet.insertRule('#lifecycle-move { width: 75px !important }', 1);
  testing.expectEqual(50, probe.getBoundingClientRect().width);
  document.head.moveBefore(style, null);
  testing.expectEqual(sheet, style.sheet);
  testing.expectEqual(2, style.sheet.cssRules.length);
  testing.expectEqual('75px', style.sheet.cssRules[1].style.width);
  testing.expectEqual(75, probe.getBoundingClientRect().width);
  testing.expectEqual(last.sheet, document.styleSheets[count - 2]);
  testing.expectEqual(sheet, document.styleSheets[count - 1]);
  testing.expectEqual(count, document.styleSheets.length);
  // Ordinary insertion is a remove + insert, not a state-preserving move.
  document.head.insertBefore(style, last);
  testing.expectTrue(sheet !== style.sheet);
  testing.expectEqual(null, sheet.ownerNode);
  testing.expectEqual(1, style.sheet.cssRules.length);
  testing.expectEqual(50, probe.getBoundingClientRect().width);
  const beforeDisconnect = style.sheet;
  style.remove();
  testing.expectEqual(null, beforeDisconnect.ownerNode);
  document.head.appendChild(style);
  testing.expectTrue(beforeDisconnect !== style.sheet);
  testing.expectEqual(25, probe.getBoundingClientRect().width);
  style.remove(); last.remove(); probe.remove();
}
</script>
<script id="children-change-subtree-preserving-order">
{
  for (const preserve of [true]) {
    const probe = document.createElement('div'); probe.id = 'lifecycle-subtree';
    probe.style.cssText = 'width: 10px; height: 10px'; document.body.appendChild(probe);
    const wrapper = document.createElement('div');
    const a = document.createElement('style'), b = document.createElement('style'), c = document.createElement('style');
    a.textContent = '#lifecycle-subtree { width: 25px !important }';
    b.textContent = '.lifecycle-other { width: 35px }';
    c.textContent = '#lifecycle-subtree { width: 50px !important }';
    wrapper.append(a, b); document.head.append(wrapper, c);
    const oldA = a.sheet, oldB = b.sheet, count = document.styleSheets.length;
    testing.expectEqual(50, probe.getBoundingClientRect().width);
    if (preserve) document.head.moveBefore(wrapper, null);
    else document.head.appendChild(wrapper);
    testing.expectEqual(25, probe.getBoundingClientRect().width);
    testing.expectEqual(c.sheet, document.styleSheets[count - 3]);
    testing.expectEqual(a.sheet, document.styleSheets[count - 2]);
    testing.expectEqual(b.sheet, document.styleSheets[count - 1]);
    testing.expectEqual(preserve, oldA === a.sheet);
    testing.expectEqual(preserve, oldB === b.sheet);
    testing.expectEqual(count, document.styleSheets.length);
    wrapper.remove(); c.remove(); probe.remove();
  }
}
</script>
