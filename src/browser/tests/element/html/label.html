<!DOCTYPE html>
<script src="../../testing.js"></script>

<label id="l1" for="input1">Name</label>
<input id="input1">

<script id="htmlFor">
  {
    const l1 = document.getElementById('l1');
    testing.expectEqual('input1', l1.htmlFor);

    l1.htmlFor = 'input2';
    testing.expectEqual('input2', l1.htmlFor);

    const l2 = document.createElement('label');
    testing.expectEqual('', l2.htmlFor);
  }
</script>

<label id="l2" for="input1"><span>Name</span></label>
<input id="input2" type="text">
<input id="input-hidden" type="hidden">
<select id="sel1"><option>a</option></select>
<button id="btn1">Click</button>
<label id="l3"><input id="input3"><span>desc</span></label>
<label id="l4"><span>no control here</span></label>
<label id="l5"><label id="l5-inner"><input id="input5"></label></label>

<script id="control">
  {
    // for attribute pointing to a text input
    const l2 = document.getElementById('l2');
    testing.expectEqual('input1', l2.control.id);

    // for attribute pointing to a non-existent id
    const lMissing = document.createElement('label');
    lMissing.htmlFor = 'does-not-exist';
    testing.expectEqual(null, lMissing.control);

    // for attribute pointing to a hidden input -> not labelable, returns null
    const lHidden = document.createElement('label');
    lHidden.htmlFor = 'input-hidden';
    document.body.appendChild(lHidden);
    testing.expectEqual(null, lHidden.control);

    // for attribute pointing to a select
    const lSel = document.createElement('label');
    lSel.htmlFor = 'sel1';
    document.body.appendChild(lSel);
    testing.expectEqual('sel1', lSel.control.id);

    // for attribute pointing to a button
    const lBtn = document.createElement('label');
    lBtn.htmlFor = 'btn1';
    document.body.appendChild(lBtn);
    testing.expectEqual('btn1', lBtn.control.id);

    // no for attribute: first labelable descendant
    const l3 = document.getElementById('l3');
    testing.expectEqual('input3', l3.control.id);

    // no for attribute: no labelable descendant -> null
    const l4 = document.getElementById('l4');
    testing.expectEqual(null, l4.control);

    // no for attribute: nested labels, first labelable in tree order
    const l5 = document.getElementById('l5');
    testing.expectEqual('input5', l5.control.id);

    // label with no for and not in document -> null
    const lDetached = document.createElement('label');
    testing.expectEqual(null, lDetached.control);
  }
</script>

<label id="labels-both" for="labels-input-both"><input id="labels-input-both"></label>
<label id="labels-wrap"><input id="labels-input-wrap"></label>
<label id="labels-external" for="labels-input-external">External</label>
<input id="labels-input-external">
<label id="labels-multiple-external" for="labels-input-multiple">External</label>
<label id="labels-multiple-wrap" for="labels-input-multiple"><input id="labels-input-multiple"></label>
<label id="labels-select-both" for="labels-select"><select id="labels-select"><option>a</option></select></label>

<script id="labels">
  {
    // One label associated by both for and nesting must appear only once.
    const both = document.getElementById('labels-both');
    const bothLabels = document.getElementById('labels-input-both').labels;
    testing.expectEqual(1, bothLabels.length);
    testing.expectTrue(bothLabels[0] === both);

    const wrap = document.getElementById('labels-wrap');
    const wrapLabels = document.getElementById('labels-input-wrap').labels;
    testing.expectEqual(1, wrapLabels.length);
    testing.expectTrue(wrapLabels[0] === wrap);

    const external = document.getElementById('labels-external');
    const externalLabels = document.getElementById('labels-input-external').labels;
    testing.expectEqual(1, externalLabels.length);
    testing.expectTrue(externalLabels[0] === external);

    // Keep distinct labels even when the wrapping label also has a matching for.
    const multipleLabels = document.getElementById('labels-input-multiple').labels;
    testing.expectEqual(2, multipleLabels.length);
    testing.expectTrue(multipleLabels[0] === document.getElementById('labels-multiple-external'));
    testing.expectTrue(multipleLabels[1] === document.getElementById('labels-multiple-wrap'));

    // Select uses the same label collection helper as input.
    const selectLabels = document.getElementById('labels-select').labels;
    testing.expectEqual(1, selectLabels.length);
    testing.expectTrue(selectLabels[0] === document.getElementById('labels-select-both'));
  }
</script>
