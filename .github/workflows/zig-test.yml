name: Fork native checks

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full commit SHA in this fork to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-native-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  LIGHTPANDA_DISABLE_TELEMETRY: true
  TEST_JOBS: 2
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  native:
    name: native (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stock-v8
            debug: false
            library: libc_v8.a
            tsan: false
          - name: debug-v8-tsan
            debug: true
            library: libc_v8_debug.a
            tsan: true
    steps:
      - name: Validate source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: '[[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested revision
        run: git rev-parse HEAD
      - uses: ./.github/actions/install
        with:
          debug: ${{ matrix.debug }}
      - name: Check formatting
        run: zig fmt --check ./
      - name: Run native suite
        run: zig build -j2 -Dprebuilt_v8_path=v8/${{ matrix.library }} -Dtsan=${{ matrix.tsan }} test
